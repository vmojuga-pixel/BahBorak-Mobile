name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          
      - name: Set Android Env
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "NDK_HOME=/usr/local/lib/android/sdk/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "PATH=$PATH:/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_ENV
          
      - name: Install NDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"
          
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
        
      - name: Install dependencies
        run: npm install
        
      - name: Init Tauri Android
        run: npx tauri android init
        
      - name: Build App
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target aarch64-linux-android
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BahBorak-APK
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
